<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>私の専用ページ</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }
    h2 { margin-top: 0; }
    .frame-area {
      width: 1280px;
      height: 720px;
      border: 2px solid #333;
      margin-bottom: 15px;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .toolbar {
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button {
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
    }
    #textInput {
      padding: 8px 12px;
      font-size: 15px;
      width: 280px;
    }
    #msg {
      margin-left: 10px;
      color: green;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>検索エンジン（フレーム内）</h2>

  <div class="toolbar">
    <button id="backBtn">← 戻る</button>
    <button id="forwardBtn">進む →</button>
    <button id="scrollUpBtn">↑ スクロール</button>
    <button id="scrollDownBtn">↓ スクロール</button>
    <button id="copyBtn">現在のURLをコピー</button>
  </div>

  <div class="toolbar">
    <input type="text" id="textInput" placeholder="ここに日本語を入力して送信">
    <button id="sendTextBtn">テキストを送信</button>
    <span id="msg"></span>
  </div>

  <div class="frame-area">
    <iframe src="/" id="browserFrame"></iframe>
  </div>

  <script>
    // 戻る
    document.getElementById('backBtn').addEventListener('click', () => {
      fetch('/api/back', { method: 'POST' });
    });

    // 進む
    document.getElementById('forwardBtn').addEventListener('click', () => {
      fetch('/api/forward', { method: 'POST' });
    });

    // 上スクロール
    document.getElementById('scrollUpBtn').addEventListener('click', () => {
      fetch('/api/scroll', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ direction: 'up', amount: 300 })
      });
    });

    // 下スクロール
    document.getElementById('scrollDownBtn').addEventListener('click', () => {
      fetch('/api/scroll', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ direction: 'down', amount: 300 })
      });
    });

    // URLコピー
    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/url');
        const data = await res.json();
        if (data.url) {
          await navigator.clipboard.writeText(data.url);
          document.getElementById('msg').textContent = 'コピーしました: ' + data.url;
        }
      } catch (e) {
        document.getElementById('msg').textContent = 'エラー: ' + e.message;
      }
    });

    // テキスト送信（日本語対応）
    document.getElementById('sendTextBtn').addEventListener('click', async () => {
      const text = document.getElementById('textInput').value;
      if (!text) return;

      try {
        await fetch('/api/type', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        document.getElementById('msg').textContent = '送信しました: ' + text;
        document.getElementById('textInput').value = '';
      } catch (e) {
        document.getElementById('msg').textContent = '送信エラー';
      }
    });

    // Enterキーでも送信
    document.getElementById('textInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('sendTextBtn').click();
      }
    });
  </script>
</body>
</html>
