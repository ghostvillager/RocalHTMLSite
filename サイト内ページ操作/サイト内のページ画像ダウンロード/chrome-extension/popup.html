<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 14px;
      font-family: "Segoe UI", Meiryo, sans-serif;
      background: #1e1e1e;
      color: #eee;
      margin: 0;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #ff453a;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #d70015; }
    button:disabled { background: #555; }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #aaa;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <button id="btn">このページをダウンロード</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
